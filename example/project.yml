name: BookApp
options:
  bundleIdPrefix: dev.hypermodular
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
targets:
  BookApp:
    type: application
    platform: iOS
    sources: [Sources, RealApp]
    info:
      path: RealApp/Info.plist
      properties:
        UILaunchScreen: {}
  BookAppTestHost:
    type: application
    platform: iOS
    sources: [Sources, TestApp]
    info:
      path: TestApp/Info.plist
      properties:
        UILaunchScreen: {}
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    info:
      path: UITests/Info.plist
    dependencies:
      - target: BookAppTestHost
    settings:
      TEST_TARGET_NAME: BookAppTestHost
schemes:
  BookAppTests:
    build:
      targets:
        BookAppTestHost: all
        UITests: [test]
    test:
      targets: [UITests]
